<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>부천이 챗봇</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="chat">
    <header>🏙️ 부천이 <small>부천시 안내 챗봇</small>
      <span id="weather" class="weather" title="부천 현재 날씨"></span>
      <button id="reset" type="button">초기화</button>
    </header>
    <div id="log" class="log"></div>
    <div class="bottom">
    <div class="chips">
      <button type="button">부천 가볼 만한 곳 추천</button>
      <button type="button">오늘 날씨에 맞는 코스 추천</button>
      <button type="button">한국만화박물관 알려줘</button>
    </div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="부천에 대해 물어보세요" autofocus>
      <button type="submit">전송</button>
    </form>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
